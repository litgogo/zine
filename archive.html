<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>播客知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@300;400;500;700;900&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Sans+Mono&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
:root {
  --bg: #f2f4f6; --bg-warm: #e9edf0; --bg-rule: #d7dde2;
  --ink: #1a1a1a; --ink-2: #333; --ink-3: #666;
  --accent: #1a1a1a; --accent-dim: rgba(26,26,26,.08);
  --rule: #c9d1d8; --mono-bg: #e4e9ec; --star: #c75146; --shelf: #e4e9ec;
}
body { background: var(--bg); color: var(--ink); font-family: 'Noto Serif SC',Georgia,serif; line-height: 1.9; -webkit-font-smoothing: antialiased; }
.site-nav {
  position: fixed; top:0; left:0; right:0; z-index:100;
  display:flex; justify-content:space-between; align-items:center;
  padding:0 4vw; height:56px;
  background: rgba(242,244,246,.82); backdrop-filter: blur(10px);
  border-bottom:1px solid var(--rule);
  font-family:'Noto Sans SC',sans-serif;
  font-size:11px; letter-spacing:.22em; text-transform:uppercase;
}
.nav-brand { color: var(--accent); font-weight:500; letter-spacing:.3em; }
.nav-links { display:flex; gap:32px; }
.nav-links a { color: var(--ink-2); text-decoration:none; transition:color .25s; }
.nav-links a:hover, .nav-links a.on { color: var(--accent); }

.wall-header { padding: 19vh 8vw 6vh; border-bottom:1px solid var(--rule); }
.wall-eyebrow { font-family:'Noto Sans Mono',monospace; font-size:11px; letter-spacing:.3em; color:var(--accent); margin-bottom:3.5vh; }
.wall-title { font-family:'Noto Serif SC',serif; font-size: clamp(30px,4.6vw,54px); font-weight:900; letter-spacing:.05em; }
.wall-sub { margin-top:2.5vh; font-family:'Noto Sans SC',sans-serif; font-weight:300; font-size:clamp(12px,1.2vw,14px); color:var(--ink-2); max-width:52ch; }

.tools {
  max-width:1500px; margin-inline:auto; padding: 3vh 6vw 1vh;
  display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center;
}
.search-wrap { position:relative; flex:1 1 240px; }
.search-wrap input {
  width:100%; padding:11px 14px 11px 34px;
  background:var(--bg); border:1px solid var(--rule);
  font-family:'Noto Serif SC',serif; font-size:13px; color:var(--ink);
  outline:none; transition:border-color .2s;
}
.search-wrap input::placeholder { color:var(--ink-3); }
.search-wrap input:focus { border-color:var(--ink); }
.search-ico { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-family:'Noto Sans Mono'; font-size:11px; }
.ctrl-group { display:flex; align-items:center; gap:10px; font-family:'Noto Sans SC',sans-serif; font-size:11px; letter-spacing:.08em; color:var(--ink-2); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip {
  font-family:'Noto Sans SC',sans-serif;
  font-size:11px; letter-spacing:.1em; color:var(--ink-2);
  background:var(--bg); border:1px solid var(--rule); padding:5px 14px; cursor:pointer;
  transition:all .2s; user-select:none;
}
.chip:hover { border-color:var(--ink); }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
select {
  padding:8px 12px; background:var(--bg); border:1px solid var(--rule);
  font-family:'Noto Sans SC',sans-serif; font-size:11px; letter-spacing:.08em;
  color:var(--ink); outline:none; cursor:pointer;
}
select:focus { border-color:var(--ink); }
.summary {
  max-width:1500px; margin-inline:auto; padding:2vh 6vw 0;
  font-family:'Noto Sans Mono',monospace; font-size:10.5px; letter-spacing:.18em; color:var(--ink-3); text-transform:uppercase;
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
}
.summary .s-mono { font-size:10px; color:var(--ink-3); }

/* ── 书架 ── */
.shelf-section { max-width:1500px; margin-inline:auto; padding:3vh 6vw 9vh; }
.shelf-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
  gap: 40px 22px;
  align-items:start;
}
.book { cursor:pointer; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
.book-cover {
  position:relative; width:100%; aspect-ratio: 2/3;
  overflow:hidden; background:var(--mono-bg);
  border:1px solid var(--rule);
  box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.05);
  transition: transform .18s ease, box-shadow .18s ease;
}
.book:hover .book-cover { transform: translateY(-4px); box-shadow: 0 4px 10px rgba(0,0,0,.08), 0 14px 30px rgba(0,0,0,.10); }
.book-cover img { width:100%; height:100%; object-fit:cover; display:block; }
/* 占位书封 */
.book-cover.fallback {
  background:var(--mono-bg);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:14% 12%;
}
.book-cover.fallback .fb-eyebrow {
  font-family:'Noto Sans Mono',monospace; font-size:9px; letter-spacing:.24em; color:var(--ink-3);
  align-self:flex-start;
}
.book-cover.fallback .fb-name {
  font-family:'Noto Serif SC',serif; font-weight:700; letter-spacing:.08em;
  writing-mode: vertical-rl; text-orientation: upright;
  font-size: clamp(15px,1.4vw,20px); line-height:1.2; color:var(--ink); text-align:center;
  max-height:70%; overflow:hidden;
}
.book-cover.fallback .fb-foot {
  font-family:'Noto Sans Mono',monospace; font-size:8px; letter-spacing:.2em; color:var(--ink-3);
  align-self:flex-end; background:var(--bg); padding:1px 6px;
}
.book-cover .cover-count {
  position:absolute; top:8px; right:8px;
  font-family:'Noto Serif SC',serif; font-size:9px; letter-spacing:.08em;
  background:rgba(26,26,26,.78); color:#fff; padding:1px 7px;
}
.star-overlay { position:absolute; left:8px; top:6px; color:var(--star); font-size:14px; text-shadow:0 1px 2px rgba(0,0,0,.4); }
.book-cap { margin-top:12px; }
.book-cap .b-name { font-size:clamp(12px,1.05vw,14px); font-weight:500; letter-spacing:.03em; }
.book-cap .b-meta { font-family:'Noto Sans Mono',monospace; font-size:9px; letter-spacing:.12em; color:var(--ink-3); margin-top:2px; }
.b-dim { opacity:.38; }

/* ── 扁平列表 ── */
.flat-wrap { max-width:1500px; margin-inline:auto; padding:2vh 6vw 10vh; }
.w-row {
  display:grid; grid-template-columns: 84px 1fr auto;
  gap:22px; align-items:baseline;
  padding:2.4vh 0; border-bottom:1px solid var(--bg-rule);
  text-decoration:none; color:inherit; transition:background .25s;
}
.w-row:hover { background:var(--bg-warm); }
.w-date { font-family:'Noto Sans Mono',monospace; font-size:10.5px; color:var(--ink-3); letter-spacing:.06em; }
.w-main { min-width:0; }
.w-show { font-family:'Noto Sans SC',sans-serif; font-size:10.5px; color:var(--accent); letter-spacing:.1em; }
.w-title { margin-top:3px; font-size:clamp(13.5px,1.3vw,16px); font-weight:400; }
.w-title .badge { font-family:'Noto Serif SC',serif; font-size:9.5px; border:1px solid var(--ink); padding:0 5px; margin-left:8px; vertical-align:2px; letter-spacing:.12em; color:var(--ink); }
.w-title .star { color:var(--star); font-size:12px; margin-left:8px; vertical-align:1px; }
.w-title .style-tag { font-family:'Noto Sans SC',sans-serif; font-size:9.5px; border:1px dashed var(--ink); padding:0 5px; margin-left:8px; vertical-align:2px; letter-spacing:.12em; color:var(--ink-2,#55544f); opacity:.85; }
.w-meta { display:flex; gap:14px; margin-top:5px; font-family:'Noto Sans Mono',monospace; font-size:10px; color:var(--ink-3); letter-spacing:.05em; }
.w-meta .ep:empty { display:none; }
.w-right { display:flex; align-items:center; gap:14px; }
.st-badge { font-family:'Noto Sans SC',sans-serif; font-size:9.5px; letter-spacing:.12em; padding:3px 10px; white-space:nowrap; }
.st-zine, .st-transcript { border:1px solid var(--ink); color:var(--ink); }
.st-pending { border:1px dashed var(--ink-3); color:var(--ink-2); }
.st-saved { border:1px solid var(--rule); color:var(--ink-3); }
.w-arrow { color:var(--ink-3); font-family:'Noto Sans Mono'; font-size:12px; }
.empty { padding:12vh 0; text-align:center; color:var(--ink-3); font-family:'Noto Sans SC'; font-size:12px; letter-spacing:.15em; }

/* ── 书本详情弹层 ── */
.modal-mask {
  position:fixed; inset:0; z-index:200; background:rgba(20,20,20,.42);
  display:none; align-items:flex-end; justify-content:center;
}
.modal-mask.show { display:flex; }
.modal {
  background:var(--bg); width:100%; max-width:760px; max-height:86vh; overflow-y:auto;
  border-top:1px solid var(--rule);
  box-shadow:0 -10px 40px rgba(0,0,0,.18);
  padding:0 7vw 6vh;
  animation:sheetUp .22s ease;
}
@keyframes sheetUp { from{ transform:translateY(24px); opacity:.4;} to{ transform:none; opacity:1;} }
.modal-head { position:sticky; top:0; background:var(--bg); padding:4.5vh 0 2vh; border-bottom:1px solid var(--rule); display:flex; align-items:baseline; gap:16px; }
.modal-head .m-title { font-family:'Noto Serif SC',serif; font-size:clamp(20px,3vw,30px); font-weight:700; letter-spacing:.05em; }
.modal-head .m-count { font-family:'Noto Sans Mono',monospace; font-size:10px; letter-spacing:.18em; color:var(--ink-3); }
.modal-close { margin-left:auto; cursor:pointer; font-family:'Noto Sans Mono'; font-size:20px; color:var(--ink-2); background:none; border:none; padding:4px 10px; }
.modal-close:hover { color:var(--ink); }
.modal-body .w-row:first-of-type { border-top:1px solid var(--bg-rule); }

.foot {
  padding:6vh 6vw 8vh; max-width:1500px; margin-inline:auto;
  border-top:1px solid var(--rule);
  font-family:'Noto Sans Mono',monospace; font-size:10px; letter-spacing:.2em; color:var(--ink-3);
  display:flex; justify-content:space-between; align-items:center; text-transform:uppercase;
}
.foot a { color:var(--ink-3); text-decoration:none; }
.foot a:hover { color:var(--accent); }

@media (max-width:900px) {
  .nav-links { display:none; }
  .wall-header { padding:16vh 8vw 6vh; }
  .shelf-grid { grid-template-columns: repeat(auto-fill, minmax(104px,1fr)); gap:30px 16px; }
  .w-row { grid-template-columns:1fr; gap:5px; }
  .w-right { display:none; }
  .summary { padding-top:1vh; }
}
</style>
</head>
<body>

<nav class="site-nav">
  <span class="nav-brand">声 · 播客知识库</span>
  <div class="nav-links">
    <a href="index.html#domains">分類</a>
    <a href="index.html#timeline">時系列</a>
    <a href="index.html#concepts">概念</a>
    <a class="on" href="archive.html">知識庫</a>
  </div>
</nav>

<header class="wall-header">
  <div class="wall-eyebrow">PODCAST LIBRARY · 播客知识库</div>
  <h1 class="wall-title">每一段值得记录的声音<br>都值得被看见</h1>
  <p class="wall-sub">一档播客，一本立在架上的书。点开一本，是它下面你听过的所有单集。你记录下的每一次收听，都是一段被留下的声音——在这里被安放，也被看见。</p>
</header>

<section class="tools">
  <div class="search-wrap">
    <span class="search-ico">⌕</span>
    <input id="q" type="text" placeholder="搜索 节目 / 单集 / 期号…" autocomplete="off">
  </div>

  <div class="ctrl-group">視图
    <div class="chips" id="viewSel">
      <button class="chip on" data-view="shelf">書架</button>
      <button class="chip" data-view="flat">按日期</button>
    </div>
  </div>

  <div class="ctrl-group">状态
    <div class="chips" id="statusChips">
      <button class="chip on" data-status="">全部</button>
      <button class="chip" data-status="zine">已转zine</button>
      <button class="chip" data-status="pending">待筛选</button>
      <button class="chip" data-status="transcript">逐字稿</button>
      <button class="chip" data-status="saved">仅收藏</button>
    </div>
  </div>

  <div class="ctrl-group">
    <label for="showSel">節目</label>
    <select id="showSel"><option value="">全部节目</option></select>
  </div>

  <div class="ctrl-group">
    <label for="sortSel">排序</label>
    <select id="sortSel">
      <option value="dateDesc">日期 · 新→旧</option>
      <option value="dateAsc">日期 · 旧→新</option>
      <option value="durDesc">时长 · 长→短</option>
    </select>
  </div>
</section>

<div class="summary" id="summary"></div>

<section class="shelf-section" id="shelfView">
  <div class="shelf-grid" id="shelfGrid"></div>
</section>
<section class="flat-wrap" id="flatView" style="display:none">
  <div class="flat-list" id="flatList"></div>
</section>

<footer class="foot">
  <span>声音落成文字 · 思考继续发生</span>
  <a href="index.html">← 返回主站</a>
</footer>

<div class="modal-mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <span class="m-title" id="mShow"></span>
      <span class="m-count" id="mCount"></span>
      <button class="modal-close" id="mClose">×</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script src="wall-data.js"></script>
<script>
/* 检索墙数据已抽到外部 wall-data.js（全站唯一数据源）——新增一期收听只改那个文件，index 和 archive 两页同时生效。 */

(function(){
  var seen={};
  WALL.forEach(function(w){ seen[w.show]=1; });
  var sel=document.getElementById('showSel');
  Object.keys(seen).sort().forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
})();

function durToSec(d){ if(!d) return -1; var p=d.split(':').map(Number); if(p.length===1) return p[0]; if(p.length===2) return p[0]*60+p[1]; return p[0]*3600+p[1]*60+(p[2]||0); }
function fmtMin(m){ var h=Math.floor(m/60); var mm=Math.floor(m%60); return h>0? h+'h'+ (mm<10?'0'+mm:mm)+'m' : mm+'m'; }
function stale(html){ var d=document.createElement('div'); d.innerHTML=html; return d.textContent; }

function rowHTML(w, showInRow){
  var badge='';
  if(w.star) badge+='<span class="star">★</span>';
  if(w.style && STYLE_LABEL[w.style]) badge+='<span class="style-tag">'+STYLE_LABEL[w.style]+'</span>';
  var link = w.link ? w.link : 'javascript:void(0)';
  var sh = (showInRow===false)? '' : '<span class="w-show">'+w.show+'</span>';
  return '<a class="w-row" href="'+link+'">'
    +'<span class="w-date">'+(w.date||'----.--.--')+'</span>'
    +'<span class="w-main">'+sh
    +'<div class="w-title">'+w.title+badge
    +'</div>'
    +'<div class="w-meta"><span class="ep">'+ (w.ep?w.ep:'') +'</span>'+(w.guest?'<span class="guest">'+w.guest+'</span>':'')+'<span class="dur">'+(w.duration? w.duration+' 时长':'时长 —')+'</span></div></span>'
    +'<span class="w-right"><span class="st-badge '+STATUS_CLASS[w.status]+'">'+STATUS_LABEL[w.status]+'</span>'
    +'<span class="w-arrow">→</span></span>'
    +'</a>';
}

/* 过滤后的当前命中集 */
function currentRows(){
  var q = stale(document.getElementById('q').value).trim().toLowerCase();
  var st = document.querySelector('#statusChips .chip.on').getAttribute('data-status');
  var show = document.getElementById('showSel').value;
  return WALL.filter(function(w){
    if(st && w.status !== st) return false;
    if(show && w.show !== show) return false;
    if(q){ var hay=(w.show+' '+w.title+' '+(w.ep||'')+' '+(w.date||'')).toLowerCase(); if(hay.indexOf(q)===-1) return false; }
    return true;
  });
}
function booksOf(rows){
  var map={}, order=[];
  rows.forEach(function(w){
    if(!map[w.show]){ map[w.show]=[]; order.push(w.show); }
    map[w.show].push(w);
  });
  order.sort(function(a,b){ return (map[b][0].date||'').localeCompare(map[a][0].date||''); });
  return order.map(function(s){ return {show:s, eps:map[s].sort(function(x,y){return (y.date||'').localeCompare(x.date||'');})}; });
}

function updateSummary(rows){
  var totalMin = WALL.reduce(function(s,w){return s+(w.duration?durToSec(w.duration)/60:0);},0);
  var st = document.querySelector('#statusChips .chip.on').getAttribute('data-status');
  var el=document.getElementById('summary');
  el.innerHTML = '<span>共 '+WALL.length+' 集 · 累计约 '+fmtMin(totalMin)+' · 当前 '+rows.length+' 集'+(st?' · '+STATUS_LABEL[st]:'')+'</span>'
    +'<span class="s-mono">点一本书 → 翻开它的单集</span>';
}

function bookCoverHTML(book, hit){
  var cover = BOOK_COVER[book.show];
  var booksClass = hit ? '' : ' b-dim';
  var star = book.eps.some(function(w){return w.star;});
  var html='<a class="book'+booksClass+'" href="javascript:void(0)" data-show="'+book.show+'">'
    +'<div class="book-cover">';
  if(cover){
    html+='<img src="'+cover+'" alt="'+book.show+'" loading="lazy">';
  } else {
    html+='<div class="book-cover fallback">'
      +'<span class="fb-eyebrow">PODCAST</span>'
      +'<span class="fb-name">'+book.show+'</span>'
      +'<span class="fb-foot">'+book.eps.length+' EP</span></div>';
  }
  if(star) html+='<span class="star-overlay">★</span>';
  if(book.eps.length>1) html+='<span class="cover-count">'+book.eps.length+'</span>';
  var gmin=book.eps.reduce(function(s,w){return s+(w.duration?durToSec(w.duration)/60:0);},0);
  html+='</div>'
    +'<div class="book-cap">'
    +'<div class="b-name">'+book.show+'</div>'
    +'<div class="b-meta">'+book.eps.length+' 集 · '+(gmin>0? fmtMin(gmin):'时长 —')+'</div>'
    +'</div></a>';
  return html;
}

function renderShelf(){
  var rows=currentRows();
  var q = stale(document.getElementById('q').value).trim().toLowerCase();
  var books=booksOf(rows);
  // 若有关键词，书按是否命中显隐（命中=节目或任一期号/标题命中）
  var grid=document.getElementById('shelfGrid');
  if(!books.length){ grid.innerHTML='<div class="empty" style="grid-column:1/-1">這一層還沒有。换个筛选看看。</div>'; updateSummary(rows); return; }
  grid.innerHTML = books.map(function(b){
    var hit = true;
    if(q){ hit = (b.show.toLowerCase().indexOf(q)>=0) || b.eps.some(function(w){ return ((w.title||'')+(w.ep||'')).toLowerCase().indexOf(q)>=0; }); }
    return bookCoverHTML(b, hit);
  }).join('');
  updateSummary(rows);
  document.getElementById('shelfView').style.display='';
  document.getElementById('flatView').style.display='none';
}

function renderFlat(){
  var rows=currentRows();
  var sort=document.getElementById('sortSel').value;
  rows.sort(function(a,b){ var d=(b.date||'').localeCompare(a.date||''); if(sort==='dateAsc') return -d; if(sort==='durDesc') return durToSec(b.duration)-durToSec(a.duration); return d; });
  document.getElementById('flatList').innerHTML = rows.length
    ? '<div class="flat-list">'+rows.map(function(w){return rowHTML(w);}).join('')+'</div>'
    : '<div class="empty">這一層還沒有。</div>';
  updateSummary(rows);
  document.getElementById('flatView').style.display='';
  document.getElementById('shelfView').style.display='none';
}

function render(){
  var view=document.querySelector('#viewSel .chip.on').getAttribute('data-view');
  if(view==='shelf') renderShelf(); else renderFlat();
}

/* 书本详情 */
function openBook(show){
  var eps = WALL.filter(function(w){ return w.show===show; })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  document.getElementById('mShow').textContent=show;
  document.getElementById('mCount').textContent=eps.length+' 集';
  document.getElementById('mBody').innerHTML = eps.map(function(w){ return rowHTML(w,false); }).join('');
  document.getElementById('mask').classList.add('show');
}
document.getElementById('shelfGrid').addEventListener('click', function(e){
  var a=e.target.closest('a.book'); if(a) openBook(a.getAttribute('data-show'));
});
document.getElementById('mClose').addEventListener('click', function(){ document.getElementById('mask').classList.remove('show'); });
document.getElementById('mask').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });

document.getElementById('q').addEventListener('input', render);
document.getElementById('showSel').addEventListener('change', render);
document.getElementById('sortSel').addEventListener('change', render);
document.querySelectorAll('#statusChips .chip').forEach(function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('#statusChips .chip').forEach(function(x){x.classList.remove('on');});
    c.classList.add('on'); render();
  });
});
document.querySelectorAll('#viewSel .chip').forEach(function(c){
  c.addEventListener('click', function(){
